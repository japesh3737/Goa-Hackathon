services:
  - type: web
    name: msmarco-rag-oracle
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python -m app.build_index"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
